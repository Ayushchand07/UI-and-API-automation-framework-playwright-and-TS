name: Nightly Regression Tests

on:
  schedule:
    - cron: "30 18 * * *"

  workflow_dispatch:

jobs:
  regression:
    name: Nightly Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Regression Tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_AUTH: ${{ secrets.API_AUTH }}
          GET_BOOKING: ${{ secrets.GET_BOOKING }}
          CREATE_BOOKING: ${{ secrets.CREATE_BOOKING }}
          UPDATE_BOOKING: ${{ secrets.UPDATE_BOOKING }}
          DELETE_BOOKING: ${{ secrets.DELETE_BOOKING }}
          BOOKING_API_USERNAME: ${{ secrets.BOOKING_API_USERNAME }}
          BOOKING_API_PASSWORD: ${{ secrets.BOOKING_API_PASSWORD }}
        run: npx playwright test --grep "@Regression" 

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-regression-report
          path: playwright-report/
          retention-days: 14